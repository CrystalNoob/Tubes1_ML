readme = "README.md"
authors = [
    { name = "Muhamad Rafli Rasyiidin", email = "masraflirasid@gmail.com" },
    { name = "Andhika Tantyo Anugrah", email = "69108822+CrystalNoob@users.noreply.github.com" },
    { name = "M. Hanief Fatkhan Nashrullah", email = "hanieffatkhan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dill>=0.4.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "matplotlib-inline>=0.2.2",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
